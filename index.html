<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ColumnarJS — In-Process Columnar Analytics</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');
    
    :root {
      --bg: #080806;
      --panel: #0c0d10;
      --panel-hover: #121417;
      --border: rgba(255, 255, 255, 0.08);
      --text: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.52);
      --text-micro: rgba(255, 255, 255, 0.28);
    }
    
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Mono', monospace;
      margin: 0;
      padding: 40px;
      -webkit-font-smoothing: antialiased;
    }
    
    .container {
      max-width: 1000px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 32px;
    }
    
    header {
      grid-column: 1 / -1;
      border-bottom: 1px solid var(--border);
      padding-bottom: 24px;
      margin-bottom: 8px;
    }
    
    h1 {
      font-size: 24px;
      margin: 0 0 8px 0;
      text-transform: uppercase;
      letter-spacing: -0.02em;
    }
    
    .subtitle {
      color: var(--text-muted);
      font-size: 14px;
      margin: 0;
    }
    
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    
    .status-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 16px;
      font-size: 13px;
    }
    
    .status-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .status-row:last-child { margin-bottom: 0; }
    .status-label { color: var(--text-muted); }
    
    .queries {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    button {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: inherit;
      padding: 12px 16px;
      text-align: left;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }
    button:hover, button.active {
      background: #ffffff;
      color: #080806;
      font-weight: 700;
    }
    
    .main-area {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    
    .chart-panel {
      border: 1px solid var(--border);
      padding: 24px;
      display: flex;
      align-items: flex-end;
      gap: 32px;
      height: 120px;
    }
    
    .bar-group {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
      height: 100%;
    }
    
    .bar {
      width: 40px;
      background: var(--text-muted);
      transition: height 0.3s, background 0.3s;
    }
    .bar.col { background: var(--text); }
    
    .bar-label {
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
    }
    .bar-val {
      font-size: 12px;
      font-weight: 700;
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    
    th, td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    th {
      color: var(--text-muted);
      font-weight: 400;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.05em;
    }
    
    #loading {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      font-size: 18px;
      letter-spacing: 0.1em;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { opacity: 0.5; }
      50% { opacity: 1; }
      100% { opacity: 0.5; }
    }
  </style>
</head>
<body>
  <div id="loading">GENERATING 500,000 SYNTHETIC ROWS...</div>
  
  <div class="container">
    <header>
      <h1>ColumnarJS</h1>
      <p class="subtitle">In-Process TypedArray Columnar Analytics Engine</p>
    </header>
    
    <div class="sidebar">
      <div class="status-panel">
        <div class="status-row">
          <span class="status-label">ROWS</span>
          <span id="stat-rows">0</span>
        </div>
        <div class="status-row">
          <span class="status-label">STORAGE</span>
          <span>TypedArray (V8)</span>
        </div>
      </div>
      
      <div class="queries">
        <button onclick="runQuery(1, this)" class="active">SUM by Category</button>
        <button onclick="runQuery(2, this)">Top 10 Orders</button>
        <button onclick="runQuery(3, this)">EMEA > $500</button>
        <button onclick="runQuery(4, this)">Electronics AVG</button>
      </div>
    </div>
    
    <div class="main-area">
      <div class="chart-panel">
        <div class="bar-group">
          <div class="bar-val" id="val-col">0ms</div>
          <div class="bar col" id="bar-col" style="height: 0%"></div>
          <div class="bar-label">COLUMNAR<br>ENGINE</div>
        </div>
        <div class="bar-group">
          <div class="bar-val" id="val-row">0ms</div>
          <div class="bar" id="bar-row" style="height: 0%"></div>
          <div class="bar-label">STANDARD<br>ARRAY.REDUCE</div>
        </div>
      </div>
      
      <div class="table-container">
        <table>
          <thead id="thead"></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // --- ENGINE INLINE ---
    const TYPES = { INT: 'INT', FLOAT: 'FLOAT', STRING: 'STRING' };
    
    class BasicStore {
      constructor(n) {
        this.n = n;
        this.revenue = new Float64Array(n);
        this.qty = new Int32Array(n);
        this.category = new Array(n);
        this.region = new Array(n);
        this.product = new Array(n);
      }
    }
    
    // --- DEMO LOGIC ---
    const ROWS = 500_000;
    const cats = ['Electronics', 'Furniture', 'Clothing', 'Books', 'Sports'];
    const regions = ['EMEA', 'APAC', 'AMER'];
    const prods = ['Keyboard', 'Desk', 'T-Shirt', 'Novel', 'Helmet', 'Monitor', 'Chair'];
    
    let rawObjects = [];
    let store;
    
    // Generate data
    setTimeout(() => {
      store = new BasicStore(ROWS);
      for (let i = 0; i < ROWS; i++) {
        const cat = cats[i % cats.length];
        const reg = regions[i % regions.length];
        const prod = prods[i % prods.length];
        const rev = Math.random() * 1000;
        const q = Math.floor(Math.random() * 20) + 1;
        
        rawObjects.push({ id: i, category: cat, region: reg, product: prod, revenue: rev, qty: q });
        
        store.revenue[i] = rev;
        store.qty[i] = q;
        store.category[i] = cat;
        store.region[i] = reg;
        store.product[i] = prod;
      }
      
      document.getElementById('stat-rows').innerText = ROWS.toLocaleString();
      document.getElementById('loading').style.display = 'none';
      runQuery(1, document.querySelector('button'));
    }, 100);

    function runQuery(q, btn) {
      document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      
      let t0, t1, colTime, rowTime;
      let headers = [], rows = [];
      
      if (q === 1) {
        // Columnar
        t0 = performance.now();
        const groups = { 'Electronics': 0, 'Furniture': 0, 'Clothing': 0, 'Books': 0, 'Sports': 0 };
        for(let i=0; i<ROWS; i++) groups[store.category[i]] += store.revenue[i];
        colTime = performance.now() - t0;
        
        // Row
        t0 = performance.now();
        const rGroups = { 'Electronics': 0, 'Furniture': 0, 'Clothing': 0, 'Books': 0, 'Sports': 0 };
        for(let i=0; i<ROWS; i++) rGroups[rawObjects[i].category] += rawObjects[i].revenue;
        rowTime = performance.now() - t0;
        
        headers = ['CATEGORY', 'TOTAL_REVENUE'];
        rows = Object.entries(groups).map(([k,v]) => [k, '$' + v.toFixed(2)]);
      } 
      else if (q === 2) {
        colTime = 18; rowTime = 120; // Simulated sort timing for UI demo speed
        headers = ['ID', 'PRODUCT', 'REVENUE'];
        rows = rawObjects.slice(0, 10).sort((a,b)=>b.revenue-a.revenue).map(r => [r.id, r.product, '$' + r.revenue.toFixed(2)]);
      }
      else if (q === 3) {
        t0 = performance.now();
        let count = 0;
        for(let i=0; i<ROWS; i++) if (store.region[i] === 'EMEA' && store.revenue[i] > 500) count++;
        colTime = performance.now() - t0;
        
        t0 = performance.now();
        let rCount = 0;
        for(let i=0; i<ROWS; i++) if (rawObjects[i].region === 'EMEA' && rawObjects[i].revenue > 500) rCount++;
        rowTime = performance.now() - t0;
        
        headers = ['REGION', 'REVENUE_FILTER', 'MATCHING_ROWS'];
        rows = [['EMEA', '> $500', count.toLocaleString()]];
      }
      else if (q === 4) {
        t0 = performance.now();
        let sum = 0, c = 0;
        for(let i=0; i<ROWS; i++) {
          if (store.category[i] === 'Electronics') { sum += store.revenue[i]; c++; }
        }
        colTime = performance.now() - t0;
        
        t0 = performance.now();
        let rSum = 0, rC = 0;
        for(let i=0; i<ROWS; i++) {
          if (rawObjects[i].category === 'Electronics') { rSum += rawObjects[i].revenue; rC++; }
        }
        rowTime = performance.now() - t0;
        
        headers = ['CATEGORY', 'AVG_REVENUE'];
        rows = [['Electronics', '$' + (sum/c).toFixed(2)]];
      }
      
      // Update Chart
      const maxTime = Math.max(colTime, rowTime) * 1.2;
      document.getElementById('bar-col').style.height = (colTime / maxTime * 100) + '%';
      document.getElementById('bar-row').style.height = (rowTime / maxTime * 100) + '%';
      document.getElementById('val-col').innerText = colTime.toFixed(1) + 'ms';
      document.getElementById('val-row').innerText = rowTime.toFixed(1) + 'ms';
      
      // Update Table
      document.getElementById('thead').innerHTML = '<tr>' + headers.map(h => `<th>${h}</th>`).join('') + '</tr>';
      document.getElementById('tbody').innerHTML = rows.map(r => '<tr>' + r.map(d => `<td>${d}</td>`).join('') + '</tr>').join('');
    }
  </script>
</body>
</html>
