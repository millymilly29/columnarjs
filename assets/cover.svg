  <g transform="translate(60, 424)" class="mono" font-size="9" fill="#444444" letter-spacing="2">
    <text x="0" y="0">MODULE: ENGINE/COLUMN-STORE.JS</text>
    <text x="450" y="0">ALGORITHM: BITMASK FILTER + HASH AGG</text>
    <text x="880" y="0">VERIFIED: 28/28 PASS</text>
