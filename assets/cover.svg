      <text x="0" y="30" fill="#FFFFFF" class="sans" font-size="28" font-weight="700">FLOAT64</text>
      <text x="0" y="52" fill="#888888" font-size="11">CONTIGUOUS TYPEDARRAYS</text>
    </g>

    <g transform="translate(600, 0)">
