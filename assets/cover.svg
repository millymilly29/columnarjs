    <text x="0" y="32" fill="#777777" class="mono" font-size="13" letter-spacing="4">IN-PROCESS TYPEDARRAY COLUMNAR ENGINE</text>
  </g>

  <line x1="60" y1="230" x2="1140" y2="230" stroke="#222222" stroke-width="1"/>

  <g transform="translate(60, 275)" class="mono" font-size="12">
    <g transform="translate(0, 0)">
      <text x="0" y="0" fill="#555555">500K GROUP BY</text>
      <text x="0" y="30" fill="#FFFFFF" class="sans" font-size="28" font-weight="700">61.0 ms</text>
      <text x="0" y="52" fill="#888888" font-size="11">7.8x FASTER THAN REDUCE</text>
    </g>

    <g transform="translate(300, 0)">
